function count(el){const n=parseInt(el.dataset.n),x=el.dataset.n.replace(/^\d+/,"");if(isNaN(n)){el.textContent=el.dataset.n;return}let s=null;const g=t=>{s??=t;const p=Math.min((t-s)/1400,1);el.textContent=Math.round(n*(1-Math.pow(1-p,3)))+x;if(p<1)requestAnimationFrame(g)};requestAnimationFrame(g)}
function typing(){const te=$("#typ"),R=D.roles;if(!te||!R.length)return;let r=0,c=0,d=0;(function t(){const w=R[r];te.textContent=w.slice(0,c);let n=70;if(!d&&c<w.length)c++;else if(!d){d=1;n=1400}else if(c>0){c--;n=35}else{d=0;r=(r+1)%R.length;n=300}tyT=setTimeout(t,n)})()}
function render(inst){const y=scrollY;clearTimeout(tyT);document.body.classList.toggle("ed",EDIT);$("#app").innerHTML=page();
 if(inst||EDIT){$$(".rv").forEach(e=>e.classList.add("in"));$$("[data-n]").forEach(e=>e.textContent=e.dataset.n);$$("[data-w]").forEach(i=>i.style.width=i.dataset.w+"%")}
 else{const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const t=e.target;t.classList.add("in");$$("[data-n]",t).forEach(count);$$("[data-w]",t).forEach(i=>i.style.width=i.dataset.w+"%");io.unobserve(t)}),{threshold:.15});$$(".rv").forEach(e=>io.observe(e))}
 if(!EDIT)typing();if(inst)scrollTo({top:y,behavior:"instant"});sc()}

 let a=-1;const L=$$("#menu a");L.forEach((l,i)=>{const s=$(l.getAttribute("href"));if(s&&s.getBoundingClientRect().top<innerHeight*.4)a=i});L.forEach((l,i)=>l.classList.toggle("on",i==a))}

function setEdit(on){EDIT=on;$("#tb")?.remove();if(on)document.body.insertAdjacentHTML("beforeend",`<div id="tb" class="glass"><b>✎ Editing</b><button class="btn bp sm" id="sv">${window.claude?"Save to live site":"Save &amp; download file"}</button>${window.claude?'<button class="btn bs sm" id="cp">Copy changes</button>':""}<button class="btn bs sm" id="ex">Exit</button><span id="msg">Tap any text to change it. Use + to add and × to remove.</span></div>`);render(1)}
function gate(){const g=document.createElement("div");g.id="gate";g.innerHTML=`<div class="glass gc"><h3>Owner access</h3><p>Enter the password to edit this site.</p><input id="pw" type="password" placeholder="Password" autocomplete="off"><div id="pe"></div><div class="row"><button class="btn bp sm" id="ok">Unlock</button><button class="btn bs sm" id="no">Cancel</button></div></div>`;document.body.append(g);const pw=$("#pw");pw.focus();
 const go=async()=>{let h="";try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(pw.value));h=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){$("#pe").textContent="Password check needs a secure (https) page.";return}
 if(h===PH){g.remove();setEdit(true)}else{$("#pe").textContent="Wrong password. Try again.";pw.value="";const c=g.firstChild;c.classList.remove("shk");void c.offsetWidth;c.classList.add("shk")}};
 $("#ok").onclick=go;$("#no").onclick=()=>g.remove();pw.onkeydown=e=>{if(e.key=="Enter")go();if(e.key=="Escape")g.remove()}}
function dl(){const b=new Blob([doc()],{type:"text/html"}),x=document.createElement("a");x.href=URL.createObjectURL(b);x.download="index.html";document.body.append(x);x.click();x.remove();$("#msg").textContent="Downloaded index.html. Upload it to your GitHub repository (replace the old file) to make the changes permanent."}
async function save(){const m=$("#msg");m.textContent="Saving…";let a=null;try{a=await window.claude?.use?.("artifact")}catch(e){}if(!a)try{a=await window.claude?.use?.("self")}catch(e){}

 try{await a.publish(doc());m.textContent="Saved ✓"}catch(e){const c=e&&e.code;m.textContent=c=="conflict"?"A newer version exists, reloading… edit again after it loads.":c=="not_writer"||c=="not_granted"?"This view can’t save ("+c+"). Tap Copy changes and send them to Claude.":"Could not save ("+(c||"error")+"): "+(e&&e.message||e)+". Tap Copy changes to keep your edits."}}
